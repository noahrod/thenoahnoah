{{ if .Site.Params.showBreadcrumb }}
<nav class="breadcrumb" aria-label="{{ i18n "breadcrumb" | default "Breadcrumb" }}">
	<ul>
		<li><a href="{{ .Site.BaseURL }}">{{ i18n "home" | default "Home" }}</a></li>
		{{ range .Ancestors.Reverse }}
		<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
		{{ end }}
		<li class="active" aria-current="page">{{ .Title }}</li>
	</ul>
</nav>
{{ end }}
